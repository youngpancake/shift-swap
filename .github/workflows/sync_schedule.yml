name: Sync QGenda Schedule

on:
  schedule:
    # Every day at 7:00 AM UTC (midnight Pacific / 3 AM Eastern)
    - cron: "0 7 * * *"
  workflow_dispatch:  # Also allows manual trigger from the GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install "playwright==1.60.0" "requests>=2.31.0" "openpyxl>=3.1.0"

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run sync
        env:
          QGENDA_PUBLIC_URL: ${{ secrets.QGENDA_PUBLIC_URL }}
          APP_URL:           ${{ secrets.APP_URL }}
          APP_ACCESS_CODE:   ${{ secrets.APP_ACCESS_CODE }}
        run: python sync/sync_schedule.py

      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: /tmp/*/debug.png
          if-no-files-found: ignore
