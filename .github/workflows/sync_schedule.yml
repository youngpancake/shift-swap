name: Sync QGenda Schedule

on:
  schedule:
    # Every Monday at 7:00 AM UTC (midnight Pacific / 3 AM Eastern)
    - cron: "0 7 * * 1"
  workflow_dispatch:  # Also allows manual trigger from the GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    # Official Playwright image — Chromium already installed, no dep issues
    container:
      image: mcr.microsoft.com/playwright/python:v1.60.0-jammy
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install "playwright==1.60.0" "requests>=2.31.0" "openpyxl>=3.1.0"

      - name: Run sync
        env:
          QGENDA_PUBLIC_URL: ${{ secrets.QGENDA_PUBLIC_URL }}
          APP_URL:           ${{ secrets.APP_URL }}
          APP_ACCESS_CODE:   ${{ secrets.APP_ACCESS_CODE }}
        run: python sync/sync_schedule.py
