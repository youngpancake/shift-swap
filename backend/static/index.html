<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift Swap Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", system-ui, sans-serif; background: #f0f2f5; color: #1a1d23; min-height: 100vh; }
    button { cursor: pointer; font-family: inherit; }

    .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
    .app-header { background: #1e2433; color: #fff; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 3px rgba(0,0,0,.3); position: sticky; top: 0; z-index: 10; }
    .app-title { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .app-logo { font-size: 22px; background: #3b82f6; border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
    .upload-btn { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.2); padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s; }
    .upload-btn:hover { background: rgba(255,255,255,.2); }
    .app-body { display: flex; flex: 1; }
    .sidebar { width: 240px; min-width: 240px; background: #fff; border-right: 1px solid #e5e7eb; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
    .field-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; }
    .resident-select { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; font-family: inherit; background: #fff; color: #1a1d23; }
    .resident-select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .resident-card { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
    .resident-name { font-weight: 600; font-size: 14px; }
    .resident-level { font-size: 12px; font-weight: 500; margin-top: 2px; }
    .resident-stats { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .level-sr { color: #7c3aed; } .level-jr { color: #0891b2; } .level-unknown { color: #6b7280; }
    .sidebar-hint { font-size: 12px; color: #9ca3af; line-height: 1.5; margin-top: auto; }
    .main-content { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }

    /* Calendar */
    .calendar { background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; padding: 20px; max-width: 560px; }
    .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .calendar-title { font-size: 16px; font-weight: 600; }
    .nav-btn { background: none; border: 1px solid #e5e7eb; border-radius: 8px; width: 32px; height: 32px; font-size: 18px; display: flex; align-items: center; justify-content: center; color: #374151; }
    .nav-btn:hover { background: #f3f4f6; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-label { text-align: center; font-size: 11px; font-weight: 600; color: #9ca3af; padding: 4px 0; text-transform: uppercase; letter-spacing: .04em; }
    .cal-cell { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; position: relative; transition: transform .1s, box-shadow .1s; }
    .cal-cell.empty { background: transparent; }
    .cal-cell.off { background: #f9fafb; color: #9ca3af; }
    .cal-cell.working { cursor: pointer; font-weight: 600; color: #1a1d23; }
    .cal-cell.working:hover { transform: scale(1.06); box-shadow: 0 2px 8px rgba(0,0,0,.12); z-index: 1; }
    .cal-cell.selected { outline: 2px solid #3b82f6; outline-offset: 2px; }
    .shift-day { background: #dbeafe; } .shift-swing { background: #fef3c7; } .shift-night { background: #e0e7ff; } .shift-unknown { background: #f0fdf4; }
    .day-num { font-size: 13px; line-height: 1; }
    .shift-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; margin-top: 2px; }
    .calendar-legend { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .legend-item { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .legend-item.off { background: #f9fafb; color: #9ca3af; }

    /* Results */
    .results-area { flex: 1; }
    .loading-state { display: flex; align-items: center; gap: 10px; color: #6b7280; padding: 20px 0; }
    .error-state { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; padding: 14px 16px; border-radius: 10px; font-size: 14px; }
    .empty-hint { color: #9ca3af; font-size: 14px; padding: 20px 0; }
    .swap-results { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px; }
    .results-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
    .results-header h3 { font-size: 16px; font-weight: 600; }
    .results-meta { font-size: 13px; color: #6b7280; margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .shift-name-pill { background: #f3f4f6; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 500; color: #374151; }
    .close-btn { background: none; border: none; font-size: 18px; color: #9ca3af; padding: 4px; line-height: 1; flex-shrink: 0; }
    .close-btn:hover { color: #374151; }
    .section-heading { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .mutual-heading { color: #059669; } .one-sided-heading { color: #d97706; }
    .count-badge { background: currentColor; color: #fff; border-radius: 20px; font-size: 11px; padding: 1px 7px; opacity: .9; }
    .section-desc { font-size: 12px; color: #9ca3af; margin-bottom: 12px; }
    .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .option-card { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
    .option-card-header { padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 8px; }
    .coverer-name { font-weight: 600; font-size: 14px; }
    .level-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: .04em; }
    .level-badge.level-sr { background: #ede9fe; color: #7c3aed; } .level-badge.level-jr { background: #cffafe; color: #0e7490; } .level-badge.level-unknown { background: #f3f4f6; color: #6b7280; }
    .option-card-body { padding: 12px 14px; }
    .swap-exchange { display: flex; align-items: center; gap: 12px; }
    .swap-side { flex: 1; }
    .swap-label { font-size: 11px; color: #6b7280; margin-bottom: 5px; font-weight: 500; }
    .swap-shift { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; }
    .swap-arrow { font-size: 20px; color: #059669; flex-shrink: 0; }
    .one-sided-info { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .shift-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; flex-shrink: 0; }
    .badge-day { background: #dbeafe; color: #1d4ed8; } .badge-swing { background: #fef3c7; color: #92400e; } .badge-night { background: #e0e7ff; color: #3730a3; } .badge-unknown { background: #f0fdf4; color: #166534; }
    .empty-state { color: #6b7280; font-size: 14px; line-height: 1.7; }

    /* Upload panel */
    .upload-panel { max-width: 500px; margin: 80px auto; padding: 0 20px; }
    .upload-hero { text-align: center; margin-bottom: 28px; }
    .upload-icon { font-size: 48px; margin-bottom: 12px; }
    .upload-hero h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .upload-hero p { color: #6b7280; font-size: 15px; }
    .drop-zone { border: 2px dashed #d1d5db; border-radius: 14px; padding: 40px; text-align: center; cursor: pointer; font-size: 15px; color: #6b7280; display: flex; flex-direction: column; align-items: center; gap: 10px; transition: border-color .15s, background .15s; background: #fff; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
    .drop-zone.loading { pointer-events: none; opacity: .7; }
    .drop-icon { font-size: 28px; }
    .upload-success { margin-top: 14px; background: #f0fdf4; border: 1px solid #86efac; color: #166534; padding: 12px 16px; border-radius: 10px; font-size: 14px; }
    .upload-error { margin-top: 14px; background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; padding: 12px 16px; border-radius: 10px; font-size: 14px; }
    .upload-help { margin-top: 28px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px 20px; font-size: 14px; line-height: 1.7; color: #4b5563; }
    .upload-help strong { display: block; margin-bottom: 8px; color: #1a1d23; }
    .upload-help ol { padding-left: 20px; }

    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useCallback, useRef, createElement: h } = React;

// ---- API ----
const api = {
  getResidents: () => fetch("/residents").then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail))),
  getSchedule: (id, start, end) => fetch(`/residents/${id}/schedule?start_date=${start}&end_date=${end}`).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail))),
  getSwapOptions: (id, date) => fetch("/swap-options", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({resident_id: id, request_date: date}) }).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail))),
  uploadCSV: (file) => { const fd = new FormData(); fd.append("file", file); return fetch("/upload-csv", {method:"POST", body:fd}).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail))); },
};

// ---- Helpers ----
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function isoDate(y, m, d) {
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function fmtDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"});
}
function shiftColor(type) {
  return type === "Day" ? "shift-day" : type === "Swing" ? "shift-swing" : type === "Night" ? "shift-night" : "shift-unknown";
}
function badgeClass(type) {
  return type === "Day" ? "badge-day" : type === "Swing" ? "badge-swing" : type === "Night" ? "badge-night" : "badge-unknown";
}

// ---- Components ----
function ShiftBadge({ type }) {
  return h("span", { className: `shift-badge ${badgeClass(type)}` }, type);
}

function UploadPanel({ onUploaded }) {
  const [dragging, setDragging] = useState(false);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const inputRef = useRef(null);

  async function handleFile(file) {
    setLoading(true); setError(null); setResult(null);
    try {
      const res = await api.uploadCSV(file);
      setResult(`Loaded ${res.residents} residents — ${res.inserted} new shifts, ${res.updated} updated.`);
      setTimeout(onUploaded, 1200);
    } catch (e) { setError(typeof e === "string" ? e : "Upload failed."); }
    finally { setLoading(false); }
  }

  return h("div", { className: "upload-panel" },
    h("div", { className: "upload-hero" },
      h("div", { className: "upload-icon" }, "📅"),
      h("h2", null, "Shift Swap Finder"),
      h("p", null, "Load your QGenda schedule to find valid swap options.")
    ),
    h("div", {
      className: `drop-zone ${dragging ? "drag-over" : ""} ${loading ? "loading" : ""}`,
      onDragOver: e => { e.preventDefault(); setDragging(true); },
      onDragLeave: () => setDragging(false),
      onDrop: e => { e.preventDefault(); setDragging(false); const f = e.dataTransfer.files[0]; if (f) handleFile(f); },
      onClick: () => inputRef.current?.click(),
    },
      h("input", { ref: inputRef, type: "file", accept: ".csv", style: {display:"none"}, onChange: e => { const f = e.target.files?.[0]; if (f) handleFile(f); } }),
      loading ? h("span", { className: "spinner" }) : h("span", { className: "drop-icon" }, "⬆"),
      loading ? null : h("span", null, "Drop CSV here or click to browse")
    ),
    result && h("div", { className: "upload-success" }, result),
    error && h("div", { className: "upload-error" }, error),
    h("div", { className: "upload-help" },
      h("strong", null, "How to export from QGenda:"),
      h("ol", null,
        h("li", null, "Go to ", h("em", null, "Reports → Schedule Export")),
        h("li", null, "Select your date range and all residents"),
        h("li", null, "Download as CSV and upload above")
      )
    )
  );
}

function Calendar({ year, month, assignments, selectedDate, onSelectDate, onPrev, onNext }) {
  const working = new Map(assignments.map(a => [a.work_date, a]));
  const firstDay = new Date(year, month - 1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const cells = [...Array(firstDay).fill(null), ...Array.from({length: daysInMonth}, (_, i) => i + 1)];
  while (cells.length % 7 !== 0) cells.push(null);

  return h("div", { className: "calendar" },
    h("div", { className: "calendar-header" },
      h("button", { className: "nav-btn", onClick: onPrev }, "‹"),
      h("span", { className: "calendar-title" }, `${MONTHS[month-1]} ${year}`),
      h("button", { className: "nav-btn", onClick: onNext }, "›")
    ),
    h("div", { className: "calendar-grid" },
      ...DAYS.map(d => h("div", { key: d, className: "cal-label" }, d)),
      ...cells.map((day, i) => {
        if (!day) return h("div", { key: `e${i}`, className: "cal-cell empty" });
        const iso = isoDate(year, month, day);
        const shift = working.get(iso);
        const isSelected = iso === selectedDate;
        return h("div", {
          key: iso,
          className: ["cal-cell", shift ? "working" : "off", shift ? shiftColor(shift.shift_type) : "", isSelected ? "selected" : ""].join(" "),
          onClick: () => shift && onSelectDate(iso),
          title: shift ? shift.shift_name : "Off",
        },
          h("span", { className: "day-num" }, day),
          shift && h("span", { className: "shift-tag" }, shift.shift_type)
        );
      })
    ),
    h("div", { className: "calendar-legend" },
      h("span", { className: "legend-item shift-day" }, "Day"),
      h("span", { className: "legend-item shift-swing" }, "Swing"),
      h("span", { className: "legend-item shift-night" }, "Night"),
      h("span", { className: "legend-item off" }, "Off"),
    )
  );
}

function OptionCard({ opt }) {
  return h("div", { className: "option-card" },
    h("div", { className: "option-card-header" },
      h("span", { className: "coverer-name" }, opt.coverer.name),
      h("span", { className: `level-badge level-${opt.coverer.level.toLowerCase()}` }, opt.coverer.level)
    ),
    h("div", { className: "option-card-body" },
      opt.type === "mutual" && opt.mutual
        ? h("div", { className: "swap-exchange" },
            h("div", { className: "swap-side" },
              h("div", { className: "swap-label" }, "They cover your shift"),
              h("div", { className: "swap-shift" }, h(ShiftBadge, { type: opt.covered_shift_type }), h("span", null, opt.covered_shift_name))
            ),
            h("div", { className: "swap-arrow" }, "⇄"),
            h("div", { className: "swap-side" },
              h("div", { className: "swap-label" }, `You cover ${fmtDate(opt.mutual.requester_covers_date)}`),
              h("div", { className: "swap-shift" }, h(ShiftBadge, { type: opt.mutual.requester_covers_shift_type }), h("span", null, opt.mutual.requester_covers_shift_name))
            )
          )
        : h("div", { className: "one-sided-info" },
            h(ShiftBadge, { type: opt.covered_shift_type }),
            h("span", null, "Covers your ", h("strong", null, opt.covered_shift_name), " shift (one-sided)")
          )
    )
  );
}

function SwapResults({ response, onClose }) {
  const total = response.mutual_options.length + response.one_sided_options.length;
  return h("div", { className: "swap-results" },
    h("div", { className: "results-header" },
      h("div", null,
        h("h3", null, `Swap options for ${fmtDate(response.request_date)}`),
        h("p", { className: "results-meta" },
          h("span", { className: "shift-name-pill" }, response.request_shift_name),
          total === 0 ? "No valid swap options found."
            : `${total} valid option${total !== 1 ? "s" : ""} — ${response.mutual_options.length} mutual, ${response.one_sided_options.length} one-sided`
        )
      ),
      h("button", { className: "close-btn", onClick: onClose }, "✕")
    ),
    total === 0 && h("div", { className: "empty-state" },
      h("p", null, "No resident can cover this shift without violating scheduling rules."),
      h("p", null, "This may be due to consecutive shift limits, missing day-off requirements, or seniority restrictions.")
    ),
    response.mutual_options.length > 0 && h("section", null,
      h("h4", { className: "section-heading mutual-heading" }, "Mutual swaps", h("span", { className: "count-badge" }, response.mutual_options.length)),
      h("p", { className: "section-desc" }, "Both residents exchange a shift — preferred."),
      h("div", { className: "options-list" }, ...response.mutual_options.map((opt, i) => h(OptionCard, { key: i, opt })))
    ),
    response.one_sided_options.length > 0 && h("section", null,
      h("h4", { className: "section-heading one-sided-heading" }, "One-sided coverage", h("span", { className: "count-badge" }, response.one_sided_options.length)),
      h("p", { className: "section-desc" }, "They pick up your shift, nothing in return — fallback only."),
      h("div", { className: "options-list" }, ...response.one_sided_options.map((opt, i) => h(OptionCard, { key: i, opt })))
    )
  );
}

function App() {
  const [residents, setResidents] = useState(null);
  const [selected, setSelected] = useState(null);
  const [year, setYear] = useState(new Date().getFullYear());
  const [month, setMonth] = useState(new Date().getMonth() + 1);
  const [assignments, setAssignments] = useState([]);
  const [selectedDate, setSelectedDate] = useState(null);
  const [swapResult, setSwapResult] = useState(null);
  const [loadingSwap, setLoadingSwap] = useState(false);
  const [swapError, setSwapError] = useState(null);

  const loadResidents = useCallback(async () => {
    try {
      const list = await api.getResidents();
      setResidents(list);
      if (list.length > 0) setSelected(r => r || list[0]);
    } catch { setResidents([]); }
  }, []);

  useEffect(() => { loadResidents(); }, []);

  useEffect(() => {
    if (!selected) return;
    const start = isoDate(year, month, 1);
    const last = new Date(year, month, 0).getDate();
    const end = isoDate(year, month, last);
    api.getSchedule(selected.id, start, end).then(setAssignments).catch(() => setAssignments([]));
    setSelectedDate(null); setSwapResult(null);
  }, [selected, year, month]);

  async function handleDateSelect(date) {
    setSelectedDate(date); setSwapResult(null); setSwapError(null);
    if (!selected) return;
    setLoadingSwap(true);
    try { setSwapResult(await api.getSwapOptions(selected.id, date)); }
    catch (e) { setSwapError(typeof e === "string" ? e : "Failed to load swap options."); }
    finally { setLoadingSwap(false); }
  }

  function prevMonth() { if (month === 1) { setYear(y=>y-1); setMonth(12); } else setMonth(m=>m-1); }
  function nextMonth() { if (month === 12) { setYear(y=>y+1); setMonth(1); } else setMonth(m=>m+1); }

  if (residents !== null && residents.length === 0) {
    return h("div", { className: "app-shell" }, h(UploadPanel, { onUploaded: loadResidents }));
  }

  return h("div", { className: "app-shell" },
    h("header", { className: "app-header" },
      h("div", { className: "app-title" },
        h("span", { className: "app-logo" }, "⇄"),
        "Shift Swap Finder"
      ),
      h("label", { className: "upload-btn", title: "Upload new QGenda CSV" },
        "Upload CSV",
        h("input", {
          type: "file", accept: ".csv", style: {display:"none"},
          onChange: async e => {
            const f = e.target.files?.[0]; if (!f) return;
            try { await api.uploadCSV(f); await loadResidents(); } catch {}
            e.target.value = "";
          }
        })
      )
    ),
    h("div", { className: "app-body" },
      h("aside", { className: "sidebar" },
        h("label", { className: "field-label" }, "Resident"),
        h("select", {
          className: "resident-select",
          value: selected?.id ?? "",
          onChange: e => setSelected(residents?.find(r => r.id === Number(e.target.value)))
        },
          (residents || []).map(r => h("option", { key: r.id, value: r.id }, `${r.name} (${r.level})`))
        ),
        selected && h("div", { className: "resident-card" },
          h("div", { className: "resident-name" }, selected.name),
          h("div", { className: `resident-level level-${selected.level.toLowerCase()}` }, `${selected.level} Resident`),
          h("div", { className: "resident-stats" }, `${assignments.length} shift${assignments.length !== 1 ? "s" : ""} this month`)
        ),
        h("div", { className: "sidebar-hint" }, "Click a working day on the calendar to see swap options.")
      ),
      h("main", { className: "main-content" },
        residents === null
          ? h("div", { className: "loading-state" }, h("span", { className: "spinner" }), " Loading…")
          : h(React.Fragment, null,
              h(Calendar, { year, month, assignments, selectedDate, onSelectDate: handleDateSelect, onPrev: prevMonth, onNext: nextMonth }),
              h("div", { className: "results-area" },
                loadingSwap && h("div", { className: "loading-state" }, h("span", { className: "spinner" }), " Finding swap options…"),
                swapError && h("div", { className: "error-state" }, swapError),
                swapResult && !loadingSwap && h(SwapResults, { response: swapResult, onClose: () => { setSwapResult(null); setSelectedDate(null); } }),
                !loadingSwap && !swapResult && !swapError && h("div", { className: "empty-hint" }, "Select a shift on the calendar to find swap options.")
              )
            )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));
</script>
</body>
</html>
