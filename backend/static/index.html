<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift Swap Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", system-ui, sans-serif; background: #f0f2f5; color: #1a1d23; min-height: 100vh; }
    button { cursor: pointer; font-family: inherit; }

    .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
    .app-header { background: #1e2433; color: #fff; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 3px rgba(0,0,0,.3); position: sticky; top: 0; z-index: 10; }
    .app-title { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .app-logo { font-size: 22px; background: #3b82f6; border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
    .upload-btn { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.2); padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s; }
    .upload-btn:hover { background: rgba(255,255,255,.2); }
    .app-body { display: flex; flex: 1; }
    .sidebar { width: 240px; min-width: 240px; background: #fff; border-right: 1px solid #e5e7eb; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
    .field-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; }
    .resident-select { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; font-family: inherit; background: #fff; color: #1a1d23; }
    .resident-select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .resident-card { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
    .resident-name { font-weight: 600; font-size: 14px; }
    .resident-level { font-size: 12px; font-weight: 500; margin-top: 2px; }
    .resident-stats { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .level-r4 { color: #be185d; } .level-sr { color: #7c3aed; } .level-jr { color: #0891b2; } .level-unknown { color: #6b7280; }
    .sidebar-divider { border: none; border-top: 1px solid #e5e7eb; margin: 2px 0; }
    .sidebar-hint { font-size: 12px; color: #9ca3af; line-height: 1.5; margin-top: auto; }
    .compare-clear-btn { background: none; border: none; font-size: 11px; color: #9ca3af; padding: 0; cursor: pointer; }
    .compare-clear-btn:hover { color: #6b7280; }
    .compare-label-row { display: flex; align-items: center; justify-content: space-between; }
    .main-content { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; min-width: 0; }

    /* Mobile controls (hidden on desktop, shown on mobile) */
    .mobile-controls { display: none; }

    /* Calendars side by side */
    .calendars-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
    .calendar-wrapper { display: flex; flex-direction: column; gap: 8px; }
    .calendar-owner-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; padding: 0 2px; }
    .calendar-owner-label.compare-label { color: #0891b2; }

    /* Calendar */
    .calendar { background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; padding: 20px; width: 360px; min-width: 260px; position: relative; overflow: hidden; }
    .calendar.compare-calendar { border-color: #bae6fd; }
    .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .calendar-header.collapsed { margin-bottom: 0; }
    .calendar-title { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; text-align: center; }
    .cal-header-right { display: flex; align-items: center; gap: 4px; }
    .cal-toggle-btn { background: none; border: 1px solid #e5e7eb; border-radius: 8px; width: 32px; height: 32px; font-size: 14px; display: flex; align-items: center; justify-content: center; color: #6b7280; transition: background .1s; }
    .cal-toggle-btn:hover { background: #f3f4f6; color: #1a1d23; }
    .nav-btn { background: none; border: 1px solid #e5e7eb; border-radius: 8px; width: 32px; height: 32px; font-size: 18px; display: flex; align-items: center; justify-content: center; color: #374151; }
    .nav-btn:hover { background: #f3f4f6; }
    .cal-resize-handle { position: absolute; top: 0; right: 0; bottom: 0; width: 8px; cursor: ew-resize; border-radius: 0 14px 14px 0; transition: background .15s; }
    .cal-resize-handle:hover, .cal-resize-handle.dragging { background: rgba(59,130,246,.18); }
    .cal-resize-handle::after { content: ""; position: absolute; top: 50%; right: 2px; transform: translateY(-50%); width: 3px; height: 28px; border-left: 1px solid #d1d5db; border-right: 1px solid #d1d5db; border-radius: 2px; }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { padding: 12px; gap: 12px; }
      .mobile-controls { display: flex; flex-direction: column; gap: 8px; background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 12px 14px; }
      .mobile-control-row { display: flex; flex-direction: column; gap: 4px; }
      .mobile-compare-label { display: flex; align-items: center; justify-content: space-between; }
      .calendars-row { flex-direction: column; gap: 12px; }
      .calendar { width: 100% !important; min-width: unset !important; padding: 14px; }
      .cal-resize-handle { display: none; }
      .cal-cell { font-size: 12px; }
      .calendar-legend { gap: 6px; }
      .legend-item { font-size: 10px; padding: 2px 7px; }
    }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; overflow: hidden; }
    .cal-label { text-align: center; font-size: 11px; font-weight: 600; color: #9ca3af; padding: 4px 0; text-transform: uppercase; letter-spacing: .04em; overflow: hidden; }
    .cal-cell { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; position: relative; transition: transform .1s, box-shadow .1s; overflow: hidden; min-width: 0; }
    .cal-cell.empty { background: transparent; }
    .cal-cell.off { background: #f9fafb; color: #9ca3af; }
    .cal-cell.working { cursor: pointer; font-weight: 600; color: #1a1d23; }
    .cal-cell.working:hover { filter: brightness(0.93); }
    .cal-cell.read-only { cursor: default !important; }
    .cal-cell.read-only:hover { transform: none !important; box-shadow: none !important; }
    .cal-cell.selected { outline: 2px solid #3b82f6; outline-offset: 2px; }
    .cal-cell.highlight-swap { outline: 2px solid #059669; outline-offset: 2px; }
    .shift-day { background: #dbeafe; } .shift-swing { background: #fef3c7; } .shift-night { background: #e0e7ff; } .shift-unknown { background: #f0fdf4; }
    .day-num { font-size: 13px; line-height: 1; }
    .shift-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .calendar-legend { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .legend-item { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .legend-item.off { background: #f9fafb; color: #9ca3af; }

    /* Results */
    .results-area { flex: 1; }
    .loading-state { display: flex; align-items: center; gap: 10px; color: #6b7280; padding: 20px 0; }
    .error-state { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; padding: 14px 16px; border-radius: 10px; font-size: 14px; }
    .empty-hint { color: #9ca3af; font-size: 14px; padding: 20px 0; }
    .swap-results { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px; }
    .results-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
    .results-header h3 { font-size: 16px; font-weight: 600; }
    .results-meta { font-size: 13px; color: #6b7280; margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .shift-name-pill { background: #f3f4f6; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 500; color: #374151; }
    .close-btn { background: none; border: none; font-size: 18px; color: #9ca3af; padding: 4px; line-height: 1; flex-shrink: 0; }
    .close-btn:hover { color: #374151; }
    .section-heading { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .mutual-heading { color: #059669; } .one-sided-heading { color: #d97706; }
    .count-badge { background: currentColor; color: #fff; border-radius: 20px; font-size: 11px; padding: 1px 7px; opacity: .9; }
    .section-desc { font-size: 12px; color: #9ca3af; margin-bottom: 12px; }
    .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .option-card { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
    .option-card-header { padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 8px; }
    .coverer-name { font-weight: 600; font-size: 14px; }
    .level-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: .04em; }
    .level-badge.level-r4 { background: #fce7f3; color: #be185d; } .level-badge.level-sr { background: #ede9fe; color: #7c3aed; } .level-badge.level-jr { background: #cffafe; color: #0e7490; } .level-badge.level-unknown { background: #f3f4f6; color: #6b7280; }
    .view-calendar-btn { margin-left: auto; background: none; border: 1px solid #bae6fd; border-radius: 6px; font-size: 11px; font-weight: 600; color: #0284c7; padding: 3px 9px; cursor: pointer; white-space: nowrap; }
    .view-calendar-btn:hover { background: #e0f2fe; }
    .view-calendar-btn.active { background: #0284c7; color: #fff; border-color: #0284c7; }
    .option-card-body { padding: 12px 14px; }
    .swap-exchange { display: flex; align-items: center; gap: 12px; }
    .swap-side { flex: 1; }
    .swap-label { font-size: 11px; color: #6b7280; margin-bottom: 5px; font-weight: 500; }
    .swap-shift { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; }
    .swap-arrow { font-size: 20px; color: #059669; flex-shrink: 0; }
    .one-sided-info { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .shift-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; flex-shrink: 0; }
    .badge-day { background: #dbeafe; color: #1d4ed8; } .badge-swing { background: #fef3c7; color: #92400e; } .badge-night { background: #e0e7ff; color: #3730a3; } .badge-unknown { background: #f0fdf4; color: #166534; }
    .empty-state { color: #6b7280; font-size: 14px; line-height: 1.7; }

    /* Upload panel */
    .upload-panel { max-width: 500px; margin: 80px auto; padding: 0 20px; }
    .upload-hero { text-align: center; margin-bottom: 28px; }
    .upload-icon { font-size: 48px; margin-bottom: 12px; }
    .upload-hero h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .upload-hero p { color: #6b7280; font-size: 15px; }
    .drop-zone { border: 2px dashed #d1d5db; border-radius: 14px; padding: 40px; text-align: center; cursor: pointer; font-size: 15px; color: #6b7280; display: flex; flex-direction: column; align-items: center; gap: 10px; transition: border-color .15s, background .15s; background: #fff; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
    .drop-zone.loading { pointer-events: none; opacity: .7; }
    .drop-icon { font-size: 28px; }
    .upload-success { margin-top: 14px; background: #f0fdf4; border: 1px solid #86efac; color: #166534; padding: 12px 16px; border-radius: 10px; font-size: 14px; }
    .upload-error { margin-top: 14px; background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; padding: 12px 16px; border-radius: 10px; font-size: 14px; }
    .upload-help { margin-top: 28px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px 20px; font-size: 14px; line-height: 1.7; color: #4b5563; }
    .upload-help strong { display: block; margin-bottom: 8px; color: #1a1d23; }
    .upload-help ol { padding-left: 20px; }

    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tab navigation */
    .tab-bar { background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; padding: 0 24px; gap: 4px; }
    .tab-btn { background: none; border: none; padding: 14px 18px; font-size: 14px; font-weight: 500; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; transition: color .15s; }
    .tab-btn:hover { color: #1a1d23; }
    .tab-btn.active { color: #3b82f6; border-bottom-color: #3b82f6; font-weight: 600; }

    /* Marketplace page */
    .mp-shell { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; max-width: 860px; }
    .mp-section { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px; }
    .mp-section-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .mp-drop-zone { border: 2px dashed #d1d5db; border-radius: 10px; padding: 24px; text-align: center; cursor: pointer; font-size: 14px; color: #6b7280; display: flex; align-items: center; justify-content: center; gap: 10px; transition: border-color .15s, background .15s; }
    .mp-drop-zone:hover, .mp-drop-zone.drag-over { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
    .mp-drop-zone.loading { pointer-events: none; opacity: .7; }
    .mp-template-hint { font-size: 12px; color: #9ca3af; margin-top: 10px; }
    .mp-template-hint code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .mp-requests-list { display: flex; flex-direction: column; gap: 8px; }
    .mp-request-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #f8fafc; border-radius: 8px; font-size: 13px; }
    .mp-request-name { font-weight: 600; min-width: 160px; }
    .mp-request-dates { display: flex; gap: 6px; flex-wrap: wrap; }
    .mp-date-pill { background: #e0f2fe; color: #0369a1; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 500; }
    .mp-clear-btn { margin-left: auto; background: none; border: 1px solid #fca5a5; color: #b91c1c; border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
    .mp-clear-btn:hover { background: #fef2f2; }
    .mp-find-btn { background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .mp-find-btn:hover { background: #2563eb; }
    .mp-find-btn:disabled { opacity: .6; cursor: default; }
    .mp-skipped { margin-top: 12px; font-size: 12px; color: #9ca3af; }
    .mp-skipped li { margin-left: 16px; }

    /* Cycle cards */
    .cycle-group { margin-bottom: 24px; }
    .cycle-group-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #059669; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .cycle-card { border: 1px solid #d1fae5; border-radius: 12px; overflow: hidden; margin-bottom: 12px; background: #f0fdf4; }
    .cycle-card-header { background: #dcfce7; padding: 10px 16px; font-size: 13px; font-weight: 600; color: #166534; display: flex; align-items: center; gap: 8px; }
    .cycle-legs { display: flex; flex-direction: column; }
    .cycle-leg { padding: 12px 16px; border-top: 1px solid #d1fae5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; background: #fff; }
    .cycle-leg:first-child { border-top: none; }
    .cycle-leg-name { font-weight: 600; min-width: 150px; }
    .cycle-leg-gives { color: #b91c1c; display: flex; align-items: center; gap: 6px; }
    .cycle-leg-gets { color: #059669; display: flex; align-items: center; gap: 6px; }
    .cycle-arrow { font-size: 16px; color: #9ca3af; }

    /* Non-swappable shifts */
    .cal-cell.not-swappable { cursor: default !important; }
    .cal-cell.not-swappable:hover { transform: none !important; box-shadow: none !important; }
    .shift-busy { background: #f3f4f6 !important; color: #6b7280 !important; }
    .non-swap-notice { background: #fefce8; border: 1px solid #fde68a; color: #92400e; padding: 14px 16px; border-radius: 10px; font-size: 14px; display: flex; align-items: flex-start; gap: 10px; }
    .non-swap-notice strong { display: block; margin-bottom: 2px; }

    .shift-tag { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: #374151; margin-top: 2px; text-align: center; line-height: 1.2; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useCallback, useRef, createElement: h } = React;

// ---- API ----
const api = {
  getResidents: () => fetch("/residents").then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail))),
  getSchedule: (id, start, end) => fetch(`/residents/${id}/schedule?start_date=${start}&end_date=${end}`).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail))),
  getSwapOptions: (id, date) => fetch("/swap-options", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({resident_id: id, request_date: date}) }).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail))),
  uploadCSV: (file) => { const fd = new FormData(); fd.append("file", file); return fetch("/upload-csv", {method:"POST", body:fd}).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail))); },
  uploadRequests: (file) => { const fd = new FormData(); fd.append("file", file); return fetch("/marketplace/requests", {method:"POST", body:fd}).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail))); },
  getRequests: () => fetch("/marketplace/requests").then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail))),
  clearRequests: () => fetch("/marketplace/requests", {method:"DELETE"}).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail))),
  getCycles: () => fetch("/marketplace/cycles").then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail))),
};

// ---- Helpers ----
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function isoDate(y, m, d) {
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function fmtDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"});
}
function shiftColor(shift) {
  if (!shift.is_swappable) return "shift-busy";
  return shift.shift_type === "Day" ? "shift-day" : shift.shift_type === "Swing" ? "shift-swing" : shift.shift_type === "Night" ? "shift-night" : "shift-unknown";
}
function badgeClass(type) {
  return type === "Day" ? "badge-day" : type === "Swing" ? "badge-swing" : type === "Night" ? "badge-night" : "badge-unknown";
}
const AREA_ABBR = { "Green": "Grn", "Purple": "Prp", "Peds": "Peds", "Fast Track": "FT", "Triage": "Tri" };
function shiftLabel(shift) {
  if (!shift.is_swappable) return shift.shift_name.split(" ")[0].slice(0, 9);
  const abbr = AREA_ABBR[shift.shift_area] || "";
  return abbr ? `${abbr} · ${shift.shift_type[0]}` : shift.shift_type;
}
function areaLabel(area, type) {
  const abbr = AREA_ABBR[area] || area;
  return abbr ? `${abbr} · ${type}` : type;
}

// ---- Components ----
function ShiftBadge({ type }) {
  return h("span", { className: `shift-badge ${badgeClass(type)}` }, type);
}

function UploadPanel({ onUploaded }) {
  const [dragging, setDragging] = useState(false);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const inputRef = useRef(null);

  async function handleFile(file) {
    setLoading(true); setError(null); setResult(null);
    try {
      const res = await api.uploadCSV(file);
      setResult(`Loaded ${res.residents} residents — ${res.inserted} new shifts, ${res.updated} updated.`);
      setTimeout(onUploaded, 1200);
    } catch (e) { setError(typeof e === "string" ? e : "Upload failed."); }
    finally { setLoading(false); }
  }

  return h("div", { className: "upload-panel" },
    h("div", { className: "upload-hero" },
      h("div", { className: "upload-icon" }, "📅"),
      h("h2", null, "Shift Swap Finder"),
      h("p", null, "Load your QGenda schedule to find valid swap options.")
    ),
    h("div", {
      className: `drop-zone ${dragging ? "drag-over" : ""} ${loading ? "loading" : ""}`,

// highlightDates: set of ISO date strings to ring in green (swap dates)
function Calendar({ year, month, assignments, selectedDate, onSelectDate, onPrev, onNext, readOnly, highlightDates, collapsed, onToggleCollapse }) {
  const [width, setWidth] = useState(360);
  const [resizing, setResizing] = useState(false);

  function onResizeMouseDown(e) {
    e.preventDefault();
    const startX = e.clientX;
    const startW = width;
    setResizing(true);
    function onMove(e) {
      setWidth(Math.min(620, Math.max(260, startW + e.clientX - startX)));
    }
    function onUp() {
      setResizing(false);
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }

  const working = new Map(assignments.map(a => [a.work_date, a]));
  const highlights = new Set(highlightDates || []);
  const firstDay = new Date(year, month - 1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const cells = [...Array(firstDay).fill(null), ...Array.from({length: daysInMonth}, (_, i) => i + 1)];
  while (cells.length % 7 !== 0) cells.push(null);

  return h("div", { className: `calendar${readOnly ? " compare-calendar" : ""}`, style: { width: `${width}px` } },
    h("div", { className: `calendar-header${collapsed ? " collapsed" : ""}` },
      h("button", { className: "nav-btn", onClick: onPrev }, "‹"),
      h("span", { className: "calendar-title" }, `${MONTHS[month-1]} ${year}`),
      h("div", { className: "cal-header-right" },
        h("button", { className: "cal-toggle-btn", onClick: onToggleCollapse, title: collapsed ? "Expand" : "Collapse" }, collapsed ? "▸" : "▾"),
        h("button", { className: "nav-btn", onClick: onNext }, "›")
      )
    ),
    !collapsed && h("div", { className: "calendar-grid" },
      ...DAYS.map(d => h("div", { key: d, className: "cal-label" }, d)),
      ...cells.map((day, i) => {
        if (!day) return h("div", { key: `e${i}`, className: "cal-cell empty" });
        const iso = isoDate(year, month, day);
        const shift = working.get(iso);
        const isSelected = iso === selectedDate;
        const isHighlighted = highlights.has(iso);
        const isSwappable = shift ? shift.is_swappable : false;
        const classes = [
          "cal-cell",
          shift ? "working" : "off",
          shift ? shiftColor(shift) : "",
          isSelected ? "selected" : "",
          isHighlighted ? "highlight-swap" : "",
          (readOnly || (shift && !isSwappable)) ? (readOnly ? "read-only" : "not-swappable") : "",
        ].filter(Boolean).join(" ");
        return h("div", {
          key: iso,
          className: classes,
          onClick: () => !readOnly && shift && onSelectDate(iso, shift),
          title: shift ? shift.shift_name : "Off",
        },
          h("span", { className: "day-num" }, day),
          shift && h("span", { className: "shift-tag" }, shiftLabel(shift))
        );
      })
    ),
    !collapsed && h("div", { className: "calendar-legend" },
      h("span", { className: "legend-item shift-day" }, "Day"),
      h("span", { className: "legend-item shift-swing" }, "Swing"),
      h("span", { className: "legend-item shift-night" }, "Night"),
      h("span", { className: "legend-item shift-busy" }, "Busy"),
      h("span", { className: "legend-item off" }, "Off"),
    ),
    h("div", { className: `cal-resize-handle${resizing ? " dragging" : ""}`, onMouseDown: onResizeMouseDown })
  );
}

function MarketplacePage() {
  const [requests, setRequests] = useState(null);   // { name: [dates] }
  const [uploading, setUploading] = useState(false);
  const [uploadMsg, setUploadMsg] = useState(null);
  const [uploadErr, setUploadErr] = useState(null);
  const [cycles, setCycles] = useState(null);
  const [skipped, setSkipped] = useState([]);
  const [finding, setFinding] = useState(false);
  const [findErr, setFindErr] = useState(null);
  const inputRef = useRef(null);

  const loadRequests = useCallback(async () => {
    try { setRequests(await api.getRequests()); }
    catch { setRequests({}); }
  }, []);

  useEffect(() => { loadRequests(); }, []);

  async function handleFile(file) {
    setUploading(true); setUploadMsg(null); setUploadErr(null); setCycles(null);
    try {
      const res = await api.uploadRequests(file);
      setUploadMsg(`Added ${res.added} request${res.added !== 1 ? "s" : ""}.${res.skipped?.length ? ` ${res.skipped.length} unmatched.` : ""}`);
      if (res.skipped?.length) setUploadErr(res.skipped.join("\n"));
      await loadRequests();
    } catch (e) { setUploadErr(typeof e === "string" ? e : "Upload failed."); }
    finally { setUploading(false); }
  }

  async function handleClear() {
    await api.clearRequests();
    setRequests({}); setCycles(null); setSkipped([]); setUploadMsg(null); setUploadErr(null);
  }

  async function handleFind() {
    setFinding(true); setFindErr(null); setCycles(null);
    try {
      const res = await api.getCycles();
      setCycles(res.cycles);
      setSkipped(res.skipped_requests || []);
    } catch (e) { setFindErr(typeof e === "string" ? e : "Failed to find cycles."); }
    finally { setFinding(false); }
  }

  const requestEntries = Object.entries(requests || {}).sort((a, b) => a[0].localeCompare(b[0]));
  const totalRequests = requestEntries.reduce((n, [, dates]) => n + dates.length, 0);

  // Group cycles by length
  const cycleGroups = {};
  (cycles || []).forEach(c => { (cycleGroups[c.cycle_length] = cycleGroups[c.cycle_length] || []).push(c); });

  return h("div", { className: "mp-shell" },
    // Upload section
    h("div", { className: "mp-section" },
      h("div", { className: "mp-section-title" }, "Upload Date Requests"),
      h("div", {
        className: `mp-drop-zone${uploading ? " loading" : ""}`,
        onDragOver: e => e.preventDefault(),
        onDrop: e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) handleFile(f); },
        onClick: () => inputRef.current?.click(),
      },
        h("input", { ref: inputRef, type: "file", accept: ".csv", style: {display:"none"}, onChange: e => { const f = e.target.files?.[0]; if (f) handleFile(f); e.target.value = ""; } }),
        uploading ? h("span", { className: "spinner" }) : h("span", null, "⬆"),
        h("span", null, uploading ? "Uploading…" : "Drop CSV here or click to browse")
      ),
      uploadMsg && h("div", { className: "upload-success", style: {marginTop: 10} }, uploadMsg),
      uploadErr && h("pre", { className: "upload-error", style: {marginTop: 10, whiteSpace: "pre-wrap", fontSize: 12} }, uploadErr),
      h("div", { className: "mp-template-hint" },
        "CSV format: two columns — ",
        h("code", null, "Name"), " and ", h("code", null, "Date"),
        ". One row per request. Names must match the QGenda schedule."
      )
    ),

    // Current requests
    h("div", { className: "mp-section" },
      h("div", { className: "mp-section-title" },
        `Current Requests (${totalRequests})`,
        totalRequests > 0 && h("button", { className: "mp-clear-btn", onClick: handleClear }, "Clear all")
      ),
      requests === null
        ? h("div", { className: "loading-state" }, h("span", { className: "spinner" }), " Loading…")
        : totalRequests === 0
          ? h("div", { className: "empty-hint", style: {padding: "8px 0"} }, "No requests yet — upload a CSV above.")
          : h("div", { className: "mp-requests-list" },
              ...requestEntries.map(([name, dates]) =>
                h("div", { key: name, className: "mp-request-row" },
                  h("span", { className: "mp-request-name" }, name),
                  h("div", { className: "mp-request-dates" },
                    ...dates.sort().map(d => h("span", { key: d, className: "mp-date-pill" }, fmtDate(d)))
                  )
                )
              )
            )
    ),

    // Find cycles
    totalRequests > 0 && h("div", { className: "mp-section" },
      h("div", { className: "mp-section-title" }, "Find Swap Cycles"),
      h("p", { style: {fontSize: 13, color: "#6b7280", marginBottom: 14} },
        "Finds 2-way, 3-way, and up to 5-way swaps where everyone gets their requested date off. All scheduling rules apply."
      ),
      h("button", { className: "mp-find-btn", onClick: handleFind, disabled: finding },
        finding ? h("span", { className: "spinner" }) : null,
        finding ? "Searching…" : "Find Swap Cycles"
      ),
      findErr && h("div", { className: "error-state", style: {marginTop: 14} }, findErr),

      cycles !== null && h("div", { style: {marginTop: 20} },
        skipped.length > 0 && h("div", { className: "mp-skipped" },
          h("strong", null, "Skipped (no swappable shift on requested date):"),
          h("ul", null, ...skipped.map((s, i) => h("li", { key: i }, s)))
        ),
        cycles.length === 0
          ? h("div", { className: "empty-state", style: {marginTop: 16} },
              h("p", null, "No valid swap cycles found among these requests."),
              h("p", null, "This may be because scheduling rules block all combinations, or no two residents are free to cover each other.")
            )
          : h("div", { style: {marginTop: 16} },
              h("p", { style: {fontSize: 13, color: "#6b7280", marginBottom: 16} },
                `Found ${cycles.length} valid swap cycle${cycles.length !== 1 ? "s" : ""}. Simpler swaps listed first.`
              ),
              ...[2, 3, 4, 5].filter(n => cycleGroups[n]).map(n =>
                h("div", { key: n, className: "cycle-group" },
                  h("div", { className: "cycle-group-title" },
                    `${n}-Way Swaps`,
                    h("span", { className: "count-badge" }, cycleGroups[n].length)
                  ),
                  ...cycleGroups[n].map((c, i) => h(CycleCard, { key: i, cycle: c, index: i }))
                )
              )
            )
      )
    )
  );
}

function App() {
  const [tab, setTab] = useState("finder");
  const [residents, setResidents] = useState(null);
  const [selected, setSelected] = useState(null);
  const [year, setYear] = useState(new Date().getFullYear());
  const [month, setMonth] = useState(new Date().getMonth() + 1);
  const [assignments, setAssignments] = useState([]);
  const [selectedDate, setSelectedDate] = useState(null);
  const [swapResult, setSwapResult] = useState(null);
  const [loadingSwap, setLoadingSwap] = useState(false);
  const [swapError, setSwapError] = useState(null);

  // Compare calendar state
  const [compareResident, setCompareResident] = useState(null);
  const [compareAssignments, setCompareAssignments] = useState([]);
  const [swapHighlightDates, setSwapHighlightDates] = useState([]);
  // Calendar collapse state
  const [calCollapsed, setCalCollapsed] = useState(false);
  const [compareCollapsed, setCompareCollapsed] = useState(false);

  const loadResidents = useCallback(async () => {
    try {
      const list = await api.getResidents();
      setResidents(list);
      if (list.length > 0) setSelected(r => r || list[0]);
    } catch { setResidents([]); }
  }, []);

  useEffect(() => { loadResidents(); }, []);

  // Load requester's schedule when selection or month changes
  useEffect(() => {
    if (!selected) return;
    const start = isoDate(year, month, 1);
    const last = new Date(year, month, 0).getDate();
    const end = isoDate(year, month, last);
    api.getSchedule(selected.id, start, end).then(setAssignments).catch(() => setAssignments([]));
    setSelectedDate(null); setSwapResult(null);
  }, [selected, year, month]);

  // Load compare resident's schedule when compare selection or month changes
  useEffect(() => {
    if (!compareResident) { setCompareAssignments([]); return; }
    const start = isoDate(year, month, 1);
    const last = new Date(year, month, 0).getDate();
    const end = isoDate(year, month, last);
    api.getSchedule(compareResident.id, start, end).then(setCompareAssignments).catch(() => setCompareAssignments([]));
  }, [compareResident, year, month]);

  async function handleDateSelect(date, shift) {
    setSelectedDate(date); setSwapResult(null); setSwapError(null);
    if (!selected) return;
    if (shift && !shift.is_swappable) {
      setSwapError(`__non_swappable__${shift.shift_name}`);
      return;
    }
    setLoadingSwap(true);
    try { setSwapResult(await api.getSwapOptions(selected.id, date)); }
    catch (e) { setSwapError(typeof e === "string" ? e : "Failed to load swap options."); }
    finally { setLoadingSwap(false); }
  }

  // When "View calendar" is clicked on a swap option card
  function handleViewCalendar(coverer, opt) {
    if (compareResident?.id === coverer.id) {
      // Toggle off
      setCompareResident(null);
      setSwapHighlightDates([]);
      return;
    }
    setCompareResident(coverer);
    // Highlight the relevant dates on the compare calendar
    const dates = [];
    if (selectedDate) dates.push(selectedDate); // requester's date they want off (coverer picks this up)
    if (opt.mutual?.requester_covers_date) dates.push(opt.mutual.requester_covers_date); // coverer gives this up
    setSwapHighlightDates(dates);
  }

  function prevMonth() { if (month === 1) { setYear(y=>y-1); setMonth(12); } else setMonth(m=>m-1); }
  function nextMonth() { if (month === 12) { setYear(y=>y+1); setMonth(1); } else setMonth(m=>m+1); }

  if (residents !== null && residents.length === 0) {
    return h("div", { className: "app-shell" }, h(UploadPanel, { onUploaded: loadResidents }));
  }

  const otherResidents = (residents || []).filter(r => r.id !== selected?.id);

  return h("div", { className: "app-shell" },
    h("header", { className: "app-header" },
      h("div", { className: "app-title" },
        h("span", { className: "app-logo" }, "⇄"),
        "Shift Swap Finder"
      ),
      h("label", { className: "upload-btn", title: "Upload new QGenda CSV" },
        "Upload CSV",
        h("input", {
          type: "file", accept: ".csv", style: {display:"none"},
          onChange: async e => {
            const f = e.target.files?.[0]; if (!f) return;
            try { await api.uploadCSV(f); await loadResidents(); } catch {}
            e.target.value = "";
          }
        })
      )
    ),
    h("nav", { className: "tab-bar" },
      h("button", { className: `tab-btn${tab === "finder" ? " active" : ""}`, onClick: () => setTab("finder") }, "Swap Finder"),
      h("button", { className: `tab-btn${tab === "marketplace" ? " active" : ""}`, onClick: () => setTab("marketplace") }, "Swap Marketplace")
    ),
    tab === "marketplace" && h(MarketplacePage, null),
    tab === "finder" && h("div", { className: "app-body" },
      h("aside", { className: "sidebar" },
        h("label", { className: "field-label" }, "Your schedule"),
        h("select", {
          className: "resident-select",
          value: selected?.id ?? "",
          onChange: e => {
            const r = residents?.find(r => r.id === Number(e.target.value));
            setSelected(r);
            if (compareResident?.id === r?.id) setCompareResident(null);
          }
        },
          (residents || []).map(r => h("option", { key: r.id, value: r.id }, `${r.name} (${r.level})`))
        ),
        selected && h("div", { className: "resident-card" },
          h("div", { className: "resident-name" }, selected.name),
          h("div", { className: `resident-level level-${selected.level.toLowerCase()}` }, `${selected.level} Resident`),
          h("div", { className: "resident-stats" }, `${assignments.length} shift${assignments.length !== 1 ? "s" : ""} this month`)
        ),
        h("hr", { className: "sidebar-divider" }),
        h("div", { className: "compare-label-row" },
          h("label", { className: "field-label" }, "Compare with"),
          compareResident && h("button", { className: "compare-clear-btn", onClick: () => { setCompareResident(null); setSwapHighlightDates([]); } }, "Clear")
        ),
        h("select", {
          className: "resident-select",
          value: compareResident?.id ?? "",
          onChange: e => {
            const val = e.target.value;
            if (!val) { setCompareResident(null); setSwapHighlightDates([]); return; }
            setCompareResident(residents?.find(r => r.id === Number(val)) || null);
            setSwapHighlightDates([]);
          }
        },
          h("option", { value: "" }, "— None —"),
          otherResidents.map(r => h("option", { key: r.id, value: r.id }, `${r.name} (${r.level})`))
        ),

      h("main", { className: "main-content" },
        residents === null
          ? h("div", { className: "loading-state" }, h("span", { className: "spinner" }), " Loading…")
          : h(React.Fragment, null,
              h("div", { className: "mobile-controls" },
                h("div", { className: "mobile-control-row" },
                  h("label", { className: "field-label" }, "Your schedule"),
                  h("select", {
                    className: "resident-select",
                    value: selected?.id ?? "",
                    onChange: e => {
                      const r = residents?.find(r => r.id === Number(e.target.value));
                      setSelected(r);
                      if (compareResident?.id === r?.id) setCompareResident(null);
                    }
                  }, (residents || []).map(r => h("option", { key: r.id, value: r.id }, `${r.name} (${r.level})`)))
                ),
                h("div", { className: "mobile-control-row" },
                  h("div", { className: "mobile-compare-label" },
                    h("label", { className: "field-label" }, "Compare with"),
                    compareResident && h("button", { className: "compare-clear-btn", onClick: () => { setCompareResident(null); setSwapHighlightDates([]); } }, "Clear")
                  ),
                  h("select", {
                    className: "resident-select",
                    value: compareResident?.id ?? "",
                    onChange: e => {
                      const val = e.target.value;
                      if (!val) { setCompareResident(null); setSwapHighlightDates([]); return; }
                      setCompareResident(residents?.find(r => r.id === Number(val)) || null);
                      setSwapHighlightDates([]);
                    }
                  },
                    h("option", { value: "" }, "— None —"),
                    (residents || []).filter(r => r.id !== selected?.id).map(r => h("option", { key: r.id, value: r.id }, `${r.name} (${r.level})`))
                  )
                )
              ),
              h("div", { className: "calendars-row" },
                h("div", { className: "calendar-wrapper" },
                  h("div", { className: "calendar-owner-label" }, selected?.name || "Your schedule"),
                  h(Calendar, { year, month, assignments, selectedDate, onSelectDate: handleDateSelect, onPrev: prevMonth, onNext: nextMonth, readOnly: false, highlightDates: [], collapsed: calCollapsed, onToggleCollapse: () => setCalCollapsed(c => !c) })
                ),
                compareResident && h("div", { className: "calendar-wrapper" },
                  h("div", { className: "calendar-owner-label compare-label" }, compareResident.name),
                  h(Calendar, { year, month, assignments: compareAssignments, selectedDate: null, onSelectDate: () => {}, onPrev: prevMonth, onNext: nextMonth, readOnly: true, highlightDates: swapHighlightDates, collapsed: compareCollapsed, onToggleCollapse: () => setCompareCollapsed(c => !c) })
                )
              ),
              h("div", { className: "results-area" },
                loadingSwap && h("div", { className: "loading-state" }, h("span", { className: "spinner" }), " Finding swap options…"),
                swapError && (swapError.startsWith("__non_swappable__")
                  ? h("div", { className: "non-swap-notice" },
                      h("div", null,
                        h("strong", null, "Cannot be swapped"),
                        `"${swapError.replace("__non_swappable__", "")}" is not an ED clinical shift and cannot be requested for a swap.`
                      )
                    )
                  : h("div", { className: "error-state" }, swapError)),
                swapResult && !loadingSwap && h(SwapResults, {
                  response: swapResult,
                  onClose: () => { setSwapResult(null); setSelectedDate(null); setSwapHighlightDates([]); },
                  compareResidentId: compareResident?.id,
                  onViewCalendar: handleViewCalendar,
                }),
                !loadingSwap && !swapResult && !swapError && h("div", { className: "empty-hint" }, "Select a shift on the calendar to find swap options.")
              )
            )
      )
    )
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));
</script>
</body>
</html>
